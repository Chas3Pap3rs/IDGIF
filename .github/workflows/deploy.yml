name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_TARGET_DIR: ${{ secrets.VPS_TARGET_DIR }}
        run: |
          set -e
          
          echo "Setting up SSH..."
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          echo "Validating SSH key..."
          if ! ssh-keygen -l -f ~/.ssh/deploy_key; then
            echo "Error: Invalid SSH key format"
            exit 1
          fi
          
          echo "Adding host to known_hosts..."
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
          
          echo "Testing SSH connection..."
          ssh -v -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "echo 'SSH connection successful'" 2>&1 || {
            echo "SSH connection failed. Check your VPS_HOST, VPS_USER, and SSH key configuration."
            exit 1
          }
          
          echo "Starting rsync deployment..."
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.DS_Store' \
            --exclude '.gitignore' \
            --exclude 'README.md' \
            --exclude 'IDGIF WIREFRAME.pdf' \
            ./ $VPS_USER@$VPS_HOST:$VPS_TARGET_DIR/
          
          echo "Deployment completed successfully"
          
          # Cleanup
          rm -f ~/.ssh/deploy_key
